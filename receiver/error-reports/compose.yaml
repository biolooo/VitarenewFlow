services:
  receiver:
    build: .
    image: vitarenew-flow-reports:0.2.0
    user: "${FLOW_REPORT_UID:-65532}:${FLOW_REPORT_GID:-65532}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:4395:4395"
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4395/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
